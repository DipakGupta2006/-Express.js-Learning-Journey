<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marksheet generator</title>
</head>
<body>

    <form action="/submit" method="POST">
        Name: <br>
        <input type="text" name="studentName" placeholder="Student Name">
        <br><br>
        Roll Number: <br>
        <input type="number" name="rollNumber" placeholder="Roll Number">
        <br><br>
        Math Marks: <br>
        <input type="number" name="mathMarks" placeholder="Math Marks">
        <br><br>
        Science Marks: <br>
        <input type="number" name="scienceMarks" placeholder="Science Marks">
        <br><br>
        English Marks: <br>
        <input type="number" name="englishMarks" placeholder="English Marks">
        <br><br>
        <button type="submit">Generate Marksheet</button>
    </form>
    
</body>
</html>
